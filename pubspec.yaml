name: task_tester_app
description: "Task Earn & 14-Day Play Store Closed Testing App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # यूज़र का डेटा (Login, Coins, Task Progress) फोन में सेव रखने के लिए
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
